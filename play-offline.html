</style><script type="module">// A life is not a score to maximize. Every route leaves something worth remembering.
const AGES = [16,17,18,19,20,21,22,24,25,27,29,30,32,34,36,38,40,42,44,46,48,50,53,56,59,62,65,68,71,74,77,80];
const C = (id,title,desc,result,effects={},extra={}) => {
  // Emphasize each choice's main value without filling every meter over 32 chapters.
  // Money is literal万円; fatigue/cost deltas remain literal, too.
  const gains=Object.entries(effects).filter(([key,value])=>key!=='money'&&value>0);
  const focus=gains.reduce((best,item)=>!best||item[1]>best[1]?item:best,null);
  const balanced=Object.fromEntries(Object.entries(effects).map(([key,value])=>[
    key,key==='money'||value<=0?value:key===focus?.[0]?Math.min(5,Math.max(3,Math.round(value/2))):1
  ]));
  return {id,title,desc,result,effects:balanced,...extra};
};

const EVENTS = [
E(16,'first-page','はじまり','まだ、何者でもない','放課後のチャイムが、いつもより遠くに聞こえた。','進路希望の紙は、まだ白いままだ。窓の向こうで、部活動へ向かう同級生の声がする。\n\n帰り支度をしていると、幼なじみの春が声をかけた。「今日、どこか寄っていく？」。これからのことはわからない。でも、今日の放課後なら選べる。','school',[
C('library','図書室で、知らない世界を読む','興味の向くまま、棚をたどる。','葵が隣の席で、同じ本を開いていた。「それ、面白いよ」。静かな場所から、小さなつながりが生まれた。',{knowledge:9,joy:3},{flags:['study'],bond:{aoi:8}}),
C('sketch','川辺で、街の絵を描く','うまさより、今の景色を残したい。','春は絵をのぞきこみ、「この街、こんな色だったんだ」と笑った。誰かに見せるのは、少し恥ずかしくてうれしかった。',{courage:6,joy:8},{flags:['creative'],bond:{haru:6}}),

C('help','商店街の手伝いに行く','顔なじみのお店が、人手を探していた。','箱を運び終えると、店主が熱いお茶を出してくれた。知らない大人にも名前を覚えてもらう。その感覚が、少し誇らしかった。',{connection:9,courage:3},{flags:['local'],bond:{haru:4}})
]),
E(17,'festival','青春','文化祭の空席','誰も手を挙げないまま、放課後が過ぎていく。','文化祭の準備が始まった。教室には段ボールと、まだ形にならないアイデアが積まれている。\n\n「{name}は、何をやってみたい？」。葵に聞かれて、役割表を見る。目立つ場所も、目立たない場所も、まだ空いていた。','school',[
C('stage','ステージで、作品を発表する','少しだけ、人の前に出てみる。','声は震えたけれど、最後までやりきった。拍手の中で、失敗しないことより、届けることを大事にしたいと思った。',{courage:10,joy:6,health:-2},{flags:['creative','first_stage'],bond:{aoi:5}}),

C('welcome','受付で、来る人を迎える','人と話すことから参加する。','最初はぎこちなかった案内も、昼には自然にできるようになった。帰り際の「ありがとう」が、思った以上に残った。',{connection:9,joy:4},{flags:['social']}),

]),
E(18,'crossroads','進路','駅には、四つのホーム','願書と求人票を、机の上に並べた。','卒業が近づいている。先生は「正解を探すより、続けられる道を」と言うけれど、どれを選んでも別の道が気になる。\n\n今すべてを決めなくていい。そう思いながら、最初に踏み出す場所を選ぶ。','station',[

]),
E(19,'small-routine','暮らし','自分のための晩ごはん','疲れて帰った部屋で、冷蔵庫を開ける。','新しい毎日には、まだ慣れないことが多い。今日は思っていたより失敗が重なった。\n\nスマートフォンには春から「元気？」の一言。返事を書きかけて、いったん手を止める。こんな夜を、どう過ごそう。','home',[
C('cook','簡単な料理を覚える','温かいものを、自分でつくる。','不格好な卵焼きを食べるうち、気持ちも落ち着いた。上手に生きられない日にも、ごはんはつくれる。',{health:7,knowledge:3,joy:4},{flags:['cook']}),
C('call','春に電話する','元気なふりを、少し休む。','取り留めない話をしていたら、気づけば笑っていた。「また話そう」。その一言が、部屋の静けさを変えた。',{connection:7,joy:6},{flags:['loyal_haru'],bond:{haru:10}}),
C('walk','夜の街をゆっくり歩く','知らない道を、ひとつだけ。','小さな公園で、まだ咲いている花を見つけた。今日一日を、失敗だけで終わらせなくてもいい気がした。',{health:5,courage:4,joy:4},{flags:['wanderer']}),
C('sleep','予定を増やさず、早く眠る','明日の自分に、休息を渡す。','返事に「今日はもう寝るね」と添えた。翌朝、窓を開けると空気が軽かった。休むことも、自分で決めていい。',{health:10,joy:3},{flags:['rest']} )
]),
E(19,'campus','学び','掲示板の小さな紙','大学の廊下には、知らない世界への入口がある。','授業とアルバイトの往復だけで、一週間が終わってしまう。そんな日の掲示板に、四つの募集が貼られていた。\n\n全部はできない。それでも、今の自分の外側に手を伸ばしてみたくなった。','school',[
C('seminar','少人数の読書会に入る','答えのない問いを話す。','同じ文章なのに、読み方は人の数だけあった。自分の意見を言う声が、少しずつ大きくなった。',{knowledge:10,courage:4},{flags:['continued_learning'],bond:{aoi:6}}),

C('volunteer','地域の子ども教室を手伝う','教えることで、学んでみる。','説明の途中で「どうして？」と聞かれ、言葉に詰まった。知ることと伝えることは違う。その発見を持ち帰った。',{connection:8,knowledge:5},{flags:['local','mentor']}),
C('balance','今は、生活のリズムを守る','授業と仕事を丁寧に続ける。','新しい予定を入れなかった分、課題を落ち着いて終えられた。自分の足元を固める時間にも、意味があった。',{health:6,knowledge:5,money:4},{flags:['steady']})
],{flags:['university']}),
E(20,'reunion','つながり','久しぶり、の続き','同級生の近況が、思っていたよりまぶしく見えた。','久しぶりに集まった教室の仲間は、少しずつ違う話し方になっていた。仕事、勉強、恋、人には言わない迷い。\n\n葵が言う。「昔の自分が見たら、今の私たち、どう思うんだろうね」。','town',[

C('plan','春と、次に会う日を決める','「また今度」を、約束に変える。','カレンダーに丸をつけた。たった一つ予定があるだけで、これからの日々に楽しみが増えた。',{connection:7,joy:6},{flags:['loyal_haru'],bond:{haru:10}}),
C('listen','それぞれの話を、よく聞く','自分の知らない道を知る。','歩いていない人生にも、忙しさや喜びがある。帰り道、人と比べる気持ちが少し薄れた。',{knowledge:6,connection:6},{bond:{haru:4,aoi:4}}),
C('early','早めに帰り、自分の時間を持つ','今夜は、静かな気持ちでいたい。','途中で抜けても、関係がなくなるわけではなかった。届いた集合写真に返事をして、自分のペースを確かめた。',{health:6,joy:5},{flags:['independent']})
]),

C('team','葵と一緒に取り組む','苦手なところを、相談する。','一人で抱えなかった分、作品には二人の視点が入った。分け合った謝礼より、次も頼っていいという実感が残った。',{money:2,connection:7,knowledge:5},{flags:['commission'],bond:{aoi:9}}),

],{flags:['creative']}),
E(21,'rain','出会い','雨宿りの二十分','傘を忘れた日、知らない人と同じ軒下に立った。','駅前の小さな書店で、雨がやむのを待っていた。隣の人が、棚から落ちたしおりを拾う。\n\n「蓮です。この店、よく来るんです」。何でもない会話なのに、不思議と続いた。雨脚は、まだ弱まらない。','station',[

]),

C('change','興味のある業界へ移る','新人になる覚悟を持つ。','また知らない言葉ばかりの日々が始まった。疲れて帰る夜も、不思議と自分で選んだ実感は薄れなかった。',{courage:10,knowledge:6,health:-3},{flags:['career_change'],set:{career:'新しい分野で働く人'}}),

]),
E(22,'graduation','旅立ち','卒業証書の重さ','四年分のノートを、ひとつの箱にしまった。','最後の授業が終わった。最初は知らなかった言葉が、今は自分の考えを支えている。\n\n葵から「次は、どこへ？」と聞かれる。答えはまだ揺れている。でもこの四年は、迷うための言葉もくれた。','school',[
C('job','学んだことを、仕事で試す','会社の中で経験を重ねる。','配属先の机に、新しいノートを置いた。知識がそのまま役立たない日にも、考え続ける習慣が助けてくれた。',{money:12,knowledge:7,courage:4},{flags:['employed'],set:{career:'専門を生かす会社員'}}),
C('research','働きながら、学び続ける','研究会や講座につながる。','生活のための仕事と、問い続けたいテーマを両方抱えた。忙しくても、簡単に捨てなかったことがうれしかった。',{knowledge:12,money:4,health:-3},{flags:['continued_learning'],set:{career:'働きながら学ぶ人'}}),
C('local','地元で、学びを役立てる','身近な人の困りごとに向き合う。','故郷の風景は同じでも、気づけることが変わっていた。お店の相談に乗るところから、新しい仕事が始まった。',{connection:9,money:7},{flags:['local'],set:{career:'地域の企画に携わる人',home:'生まれ育った街'}}),
C('explore','期限を決めて、別の道を試す','短期の仕事で生活を支える。','半年間だけ、と区切ると一歩を出せた。遠回りに見える時間にも、自分にしか拾えないものがあるかもしれない。',{courage:10,joy:6,money:3},{flags:['independent','wanderer'],set:{career:'次の道を探しながら働く人'}})
],{flags:['university']}),
E(24,'invitation','つながり','予定のない日曜日','一通の誘いで、休日の輪郭が変わる。','久しぶりに何も予定のない休日ができた。春は近所の集まりに、葵は展示に誘ってくれた。蓮からも短い近況が届いている。\n\n誰かと会う日にも、一人で過ごす日にも、自分なりの意味がありそうだ。','park',[
C('haru','春と、近所の集まりへ行く','見慣れた街の新しい顔を知る。','初対面の人も、春の一言で少し近くなった。帰るころには、また立ち寄れる場所が一つ増えていた。',{connection:9,joy:5},{flags:['local','loyal_haru'],bond:{haru:10}}),
C('aoi','葵と、展示を見に行く','感じたことを言葉にしてみる。','同じ作品の前で、違う話が始まった。感想が一致しなくても、一緒に見られることがうれしかった。',{knowledge:6,joy:6},{flags:['creative'],bond:{aoi:10}}),
C('ren','蓮に連絡して、会ってみる','もう少し、相手のことを知りたい。','話題が途切れても、気まずくなかった。急いで関係に名前をつけず、また会う約束だけをした。',{connection:7,joy:7},{flags:['close_ren'],bond:{ren:12}}),
C('solo','予定を入れず、のんびり過ごす','何もしない余白を楽しむ。','洗濯物が風に揺れるのを眺めた。一日を説明できなくても、満たされる日はある。',{health:8,joy:7},{flags:['balance']})
]),
E(24,'promotion','仕事','頼られる、ということ','上司の「任せたい」が、帰り道まで残っていた。','新しい仕事のまとめ役を打診された。成長できそうな仕事だけれど、慣れるまでは負担も増える。\n\n帰宅して予定帳を開く。仕事のことも、自分の暮らしのことも、どちらも軽く扱いたくなかった。','city',[
C('lead','まとめ役に挑戦する','まずは、経験してみる。','全員の意見がまとまらない日もあった。それでも相談しながら進めるうち、一人で完璧でなくていいとわかった。',{courage:10,knowledge:7,money:14,health:-5},{flags:['leader']}),
C('scope','担当範囲を相談して引き受ける','続けられる条件をつくる。','断るか受けるかだけではなかった。話し合って決めた範囲だからこそ、責任を持って取り組めた。',{courage:7,health:3,money:8},{flags:['boundaries']}),
C('expert','専門の仕事を深めたいと伝える','得意な場所から支える。','肩書きは変わらなくても、難しい相談が集まるようになった。自分に合う頼られ方を、少しずつつくった。',{knowledge:10,money:8,joy:4},{flags:['expert']}),
C('decline','今回は、今の働き方を続ける','暮らしの余白を優先する。','伝えるときは緊張した。でも帰りに寄った公園で、守りたかった時間の輪郭がはっきりした。',{health:8,joy:6},{flags:['balance']})
],{flags:['employed']}),
E(25,'room','暮らし','窓から見える景色','住む場所を変えると、何が変わるだろう。','部屋の更新時期が近づいた。{home}にも慣れたけれど、物件の窓から見える景色に少し心が動く。\n\n広さや通勤時間だけでは決められない。どんな一日を重ねたいのか、間取りを見ながら考えた。','home',[
C('near','今の街で、小さく暮らす','使うものを見直して身軽になる。','片づけた机に朝の光が届いた。引っ越さなくても、生活を少し新しくできることに気づいた。',{joy:6,health:5,money:4},{flags:['simple_life']}),
C('city','便利な街へ引っ越す','準備資金を使って生活を変える。','段ボールを開けた夜、窓の外には知らない灯りがあった。不安とわくわくを、同じ部屋に置いた。',{money:-12,courage:7,connection:4},{requires:{money:12},set:{home:'人の行き交う街'}}),
C('nature','自然に近い暮らしを探す','まずは、週末から通ってみる。','移り住む前に、何度も街を歩いた。景色の美しさだけでなく、買い物や雨の日のことも知ったうえで、この街へ移り住むことを決めた。',{health:7,joy:6,knowledge:3},{flags:['nature'],set:{home:'自然の近い街'}}),
C('share','身近な人と、暮らし方を相談する','一人で抱えない生活を考える。','今すぐ一緒に住まなくても、頼っていいことを確認できた。暮らしの地図に、人の気配が増えた。',{connection:9,joy:4},{flags:['shared_life'],bond:{haru:5,ren:5}})
]),
E(25,'first-tools','手仕事','自分の道具箱','先輩が、使い込まれた工具を見せてくれた。','見習いだったころより、手が迷わなくなった。ある日、先輩が小さな仕事を一人で担当してみないかと言った。\n\n道具箱を開くと、最初の失敗の跡まで残っている。これから、どんな腕の磨き方をしよう。','town',[
C('solo','一人で仕上げまで担当する','今の技術を、仕事にする。','最後の確認を終えたとき、肩の力が抜けた。「またお願いします」。その短い言葉を、何度も思い出した。',{knowledge:9,courage:8,money:12,health:-3},{flags:['expert'],set:{career:'一人前の技術職'}}),
C('mentor','後輩と一緒に取り組む','伝えながら、自分も学ぶ。','説明して初めて、感覚で覚えていたことに名前がついた。後輩の疑問は、自分の仕事も丁寧にしてくれた。',{knowledge:7,connection:8,money:7},{flags:['mentor'],set:{career:'仲間と働く技術職'}}),
C('design','自分の作品もつくってみる','依頼以外の形を探す。','休みの日にできた小さな作品を、窓辺に置いた。売れるかどうかより、もう一つつくりたいと思えた。',{joy:9,courage:6},{flags:['creative','artisan_artist'],set:{career:'仕事と制作を続ける職人'}}),
C('steady','基礎をもう一度学び直す','急がず、長く使える技術にする。','当たり前だと思っていた手順に、理由があった。遠回りの復習が、次の仕事で自分を支えてくれた。',{knowledge:12,health:3,money:5},{flags:['expert','continued_learning'],set:{career:'技術を磨く職人'}})
],{flags:['artisan'],notFlags:['career_change']}),
E(27,'distance','関係','ちょうどいい距離','親しい人ほど、言葉にしないことが増えていた。','仕事帰り、誰かに話したいことがあった。けれど、みんなにもそれぞれの生活がある。\n\n近づきたい気持ちと、一人でいたい気持ち。その両方を、これからの関係の中で大事にできるだろうか。','park',[
C('meet','大切な人と、会う時間を決める','自然任せにしない。','先に時間を取っておくと、忙しい日にも楽しみが残った。関係は気持ちだけでなく、予定でも育つらしい。',{connection:9,joy:5},{flags:['intentional_bonds'],bond:{haru:7,aoi:7}}),
C('new','新しい集まりに参加する','年齢も仕事も違う人と話す。','いつもの自分を知らない人たちの前で、別の話ができた。居場所は、一つでなくてもよかった。',{connection:8,courage:6},{flags:['community']}),
C('solo','一人で過ごす楽しみを育てる','自分と機嫌よく暮らす。','一人で入った映画館の帰り道、誰の感想も借りずに余韻を味わった。孤独と自由の違いを、少し覚えた。',{joy:9,courage:4},{flags:['independent'],set:{relationship:'自分の時間を大切に'}}),
C('honest','気になっていたことを伝える','言葉にしない期待を減らす。','うまく伝わらないところは、もう一度話した。すぐに解決しなくても、話し合えることが支えになった。',{courage:8,connection:7},{flags:['boundaries'],bond:{ren:6,aoi:6}})
]),
E(27,'ren-choice','大切な人','ふたりで歩く帰り道','蓮といる時間が、日常の一部になっていた。','駅までの道を、ゆっくり歩いている。蓮が足を止め、「これからも、こうして会いたい」と言った。\n\n関係に同じ名前をつけなくても、気持ちは確かめられる。自分が望む距離を、言葉にしてみよう。','station',[
C('partner','パートナーとして歩んでみたい','これからを、一緒に考える。','蓮は少し安心したように笑った。約束は未来の保証ではない。それでも、困ったら話す相手を互いに選んだ。',{joy:10,connection:8},{flags:['partnered'],set:{relationship:'蓮と歩む日々'},bond:{ren:18}}),
C('friend','大切な友人として続けたい','今の気持ちを、誠実に伝える。','少し長い沈黙のあと、蓮はうなずいた。すぐに元通りではなくても、お互いの言葉を尊重するところから続けた。',{courage:8,connection:5},{flags:['friend_ren'],set:{relationship:'大切な友人に囲まれて'},bond:{ren:8}}),
C('slow','もう少し、時間をかけたい','答えを急がずに向き合う。','二人で考える余白を残した。待つことも曖昧にすることも違う。次に話す日を決めて、その日は別れた。',{joy:6,courage:5},{flags:['slow_relationship'],bond:{ren:10}}),
C('independent','今は、自分の生活を選びたい','期待に合わせず、自分に正直に。','胸は少し痛んだ。でも望んでいない約束はしなかった。帰り道に、自分の気持ちを大切にできた実感が残った。',{courage:9,health:4},{flags:['independent'],set:{relationship:'自分のペース'}})
],{flags:['close_ren']}),
E(29,'new-offer','転機','少し大きな話','うれしい誘いほど、簡単には決められない。','知人から、新しい企画に加わらないかと声をかけられた。自由は増えるけれど、収入や時間の見通しは今より揺れそうだ。\n\n今の生活にも、積み上げたものがある。変えることと守ることを、同じ机に並べて考える。','city',[
C('start','小さく試してから判断する','今の仕事と両立する範囲で。','試してみると、想像と違う大変さも楽しさも見えた。無理のない規模で続ける方法を、少しずつ探した。',{courage:8,knowledge:6,money:5,health:-3},{flags:['independent_work']}),
C('join','条件を確認して、参加する','一歩踏み込む選択をする。','契約と役割を確かめて、企画の仲間になった。成功は約束されないけれど、自分の意見が形になる時間が増えた。',{courage:11,connection:6,health:-4},{flags:['independent_work','new_project'],set:{career:'新しい事業に携わる人'}}),
C('support','今の立場から協力する','得意な部分だけを引き受ける。','全部を変えなくても関われた。いつもの仕事で得た経験が、外の世界でも役立つことを知った。',{knowledge:5,connection:7,money:5},{flags:['network']}),
C('stay','今回は見送り、暮らしを守る','今ある大切なものに時間を使う。','断ったあとにも、関係は続いた。選ばなかった道を惜しみながら、選んだ一日を丁寧に過ごした。',{health:7,joy:7,money:6},{flags:['balance']})
]),
E(29,'exhibition','表現','壁に、自分の名前','小さな展示スペースの空きが出たと連絡が来た。','長く続けてきた創作を、まとめて見せる機会ができた。昔の作品を並べると、変わったところと変わらないところが見える。\n\n誰かに見せるために続けたわけではない。それでも、届くとしたら、どんな形がいいだろう。','town',[
C('show','小さな展示を開く','準備に使う資金を確保する。','壁に並んだ作品は、机の上とは違って見えた。来場者の一言が、長いあいだ持っていた迷いを少しほぐした。',{money:-6,courage:10,joy:10},{requires:{money:6},flags:['exhibition']}),
C('online','無料の作品ページをつくる','離れた場所へも届ける。','知らない街の人から、短い感想が届いた。会ったことがなくても、同じものを大切に思えることがうれしかった。',{knowledge:6,courage:7,joy:7},{flags:['exhibition','online_artist']}),
C('gift','身近な人に、作品を贈る','顔の見える相手へ届ける。','春は作品を部屋に飾った写真を送ってきた。大勢に届かなくても、一人の日常に残る喜びがあった。',{connection:9,joy:8},{flags:['gift_artist'],bond:{haru:10}}),
C('private','今は、制作そのものを楽しむ','公開の予定を決めずに続ける。','締切を外すと、もう一度遊ぶようにつくれた。見せる時期も、見せない自由も、自分で選べる。',{joy:10,health:5},{flags:['private_artist']})
],{flags:['creative']}),
E(30,'old-notebook','節目','十六歳のノート','引き出しの奥から、昔の自分が顔を出した。','片づけの途中で、学生時代のノートを見つけた。将来のことは大きく書いてあるのに、今日の悩みは小さな文字だ。\n\nあのころ想像した大人になっているだろうか。違っていても、この十数年は確かに自分のものだった。','home',[
C('letter','昔の自分へ、手紙を書く','できたことも、迷いも伝える。','思ったより長い手紙になった。約束通りではない人生にも、ちゃんと会えてよかった人がいた。',{joy:8,knowledge:4},{flags:['reflective']}),
C('dream','諦めかけたことを、再開する','週に一時間から始める。','最初は下手でも、もう一度始めた自分を嫌いにならずに済んだ。遅いかどうかより、今日やったことが残った。',{courage:9,joy:7},{flags:['second_start']}),
C('friends','ノートの話を、友人にする','それぞれの今を持ち寄る。','春も葵も、予定どおりではないと言った。三人で笑っていると、昔の夢も今の暮らしも少し愛おしかった。',{connection:9,joy:6},{bond:{haru:8,aoi:8}}),
C('present','ノートをしまい、今を楽しむ','過去に採点してもらわない。','昔の自分に説明できなくても、好きな朝の過ごし方がある。それで十分な日もあると、そっと箱を閉じた。',{health:5,joy:9},{flags:['present']})
]),
E(30,'local-shop','街との関係','商店街の、消えない灯り','顔なじみの店主から、閉店を考えていると聞いた。','昔、手伝いに行った通りで、店主がぽつりと話した。店を続けたい気持ちと、休みたい気持ちの両方があるという。\n\n自分が何とかする、だけでは足りない。相手の望みも聞きながら、できることを考えた。','town',[
C('event','仲間と、週末の企画をつくる','お店の負担を増やさず試す。','小さな催しに、久しぶりの顔が集まった。売上だけで結論は出せなくても、この店を思う人が見える一日になった。',{connection:10,courage:6,health:-3},{flags:['community','community_archive']}),
C('record','店の思い出を記録する','続いても、閉じても残せるように。','古い写真の裏から、知らなかった街の話が出てきた。店主は久しぶりに、そのころのあだ名で笑った。',{knowledge:8,connection:7},{flags:['community_archive','writer']}),
C('help','無理のない範囲で手伝う','定期的に、短い時間だけ。','手伝う曜日と時間を決めた。長く関わるために、できないことも最初に伝えた。',{connection:8,joy:5},{flags:['community','boundaries']}),
C('respect','気持ちを聞き、決断を尊重する','残ってほしい気持ちを押しつけない。','店主は「話せてよかった」と言った。何かを変えなくても、選ぶ人の隣にいることはできた。',{connection:7,knowledge:5,joy:4},{flags:['listener']})
],{flags:['local']}),
E(32,'ordinary-week','暮らし','同じようで、同じでない','何気ない一週間を、少しだけ変えたくなった。','{career}としての日々に、いつもの動きができている。便利な習慣もあれば、気づけば疲れてしまう習慣もある。\n\n大きな決断がない季節にも、生活は続く。この一週間に、小さな変化を加えるなら。','home',[
C('morning','朝に、静かな時間をつくる','十分だけ、画面を見ずに過ごす。','湯気を眺める短い時間が、一日の始まりを変えた。全部を急がなくても、朝は進んでいった。',{health:8,joy:5},{flags:['rest']}),
C('meal','誰かと食べる日をつくる','友人に、気軽な夕食を誘う。','特別な料理はなかった。食器を片づけながら話す時間に、思っていた以上に救われた。',{connection:9,joy:6},{bond:{haru:5,aoi:5}}),
C('skill','新しいことを、少し学ぶ','一日に一ページから。','すぐに役立つかはわからない。けれど、知らないことが減るより、知りたいことが増えるのが楽しかった。',{knowledge:9,joy:4},{flags:['continued_learning']}),
C('reduce','予定と持ち物を減らしてみる','足す前に、余白をつくる。','空いた予定欄に、安心した。できない自分を責める代わりに、抱える量を変えることもできた。',{health:9,joy:4},{flags:['simple_life','boundaries']})
]),
E(32,'shared-table','ふたりの暮らし','同じ食卓、違うリズム','一緒にいることと、同じであることは違った。','蓮と今後の暮らしを話している。帰る時間も、お金の使い方も、一人になりたい時間も少しずつ違う。\n\n長く一緒にいるために、今ちゃんと話しておきたいことがあった。','home',[
C('together','一緒に暮らす準備を進める','役割や費用を、具体的に話す。','好きという気持ちだけでは決まらない話も、ひとつずつした。二人で使う鍵が、日常の始まりになった。',{connection:10,joy:8},{flags:['shared_life'],set:{relationship:'蓮と暮らす日々'},bond:{ren:14}}),
C('apart','別々の場所で、関係を育てる','会う時間と一人の時間を守る。','住所を同じにしなくても、相談はできる。二人に合う形を話せたことで、前より安心して会えるようになった。',{health:6,joy:8},{flags:['boundaries'],set:{relationship:'蓮と、それぞれの暮らし'},bond:{ren:12}}),
C('future','将来の希望を、ゆっくり聞き合う','家族や仕事、決めていないことも。','答えの合わないところもあった。今日すべてを決めず、変わったらまた話そうと約束した。',{knowledge:5,connection:8},{flags:['intentional_bonds'],bond:{ren:13}}),
C('renew','一度、関係の距離を見直す','今の気持ちに正直でいたい。','難しい話になったけれど、言えないままにはしなかった。少し距離を取り、それぞれの時間を大切にすることにした。',{courage:10,health:4},{flags:['separated'],set:{relationship:'新しい距離を探して'},bond:{ren:-8}})
],{flags:['partnered'],notFlags:['separated']}),
E(34,'support-call','支え合い','「ちょっと、頼める？」','家族からの電話は、いつもよりゆっくりだった。','身近な家族の生活に、少し手助けが必要になった。通院の付き添いや日々の買い物。一回ならできても、これから先はわからない。\n\n自分の仕事や暮らしもある。一人で決めずに、支え方を考えることになった。','home',[
C('regular','できる曜日を決めて手伝う','続けられる役割を引き受ける。','毎回全部はできなくても、決まった日に会える安心ができた。無理のない約束は、相手にも自分にも支えになった。',{connection:8,health:-2,joy:4},{flags:['caregiver','boundaries']}),
C('share','家族や周囲と、分担を相談する','人ごとにできることを出し合う。','話してみると、知らなかった事情も見えた。完璧な分担ではなくても、一人だけで抱えない形に近づいた。',{connection:9,courage:5},{flags:['care_network']}),
C('service','相談窓口で、使える支援を調べる','専門の人と一緒に考える。','困りごとを言葉にすると、必要な支えが整理された。家族の力だけで解決しなくてもいいことを知った。',{knowledge:9,health:3},{flags:['care_network','resourceful']}),
C('listen','まず、本人の希望を聞く','手伝う前に、望む暮らしを知る。','心配する側の考えだけでは、見えない希望があった。できなくなったことより、続けたいことから話を始めた。',{connection:8,knowledge:5},{flags:['listener']})
]),
E(36,'next-generation','次の世代','小さな手に、手を振る','公園で、子どもたちの声を聞いていた。','春と歩いていると、子どもが落とした帽子を追いかけてきた。渡すと、照れくさそうにお礼を言う。\n\n誰かの成長に関わる暮らしも、自分の時間を育てる暮らしもある。これから大切にしたいものを、少し考えた。','park',[
C('family','家族を育む道を、具体的に考える','希望や環境、支援を調べて相談する。','家族の形を急いで決めず、相談を重ねた。その後の数年、迎える準備や手続きを経て、子どもと暮らす日々が始まった。',{connection:10,joy:9,health:-4},{flags:['family'],set:{relationship:'家族と育む暮らし'}}),
C('mentor','地域で、子どもの学びを手伝う','自分にできる時間から関わる。','問題を解くより、話を聞いてほしい日もある。教えるつもりで行って、何度も新しい見方を教わった。',{connection:9,knowledge:5,joy:5},{flags:['mentor','community']}),
C('friends','身近な友人や家族の支えになる','頼れる大人が一人増えるように。','特別な役割を名乗らず、困った日に声をかけてもらえるようにした。小さな関わりにも、続いていく温かさがあった。',{connection:10,joy:5},{flags:['chosen_family'],bond:{haru:8}}),
C('own','今の暮らしを、もっと大切にする','望む形を、人と比べずに選ぶ。','自分で使える時間を、好きなことや人に丁寧に渡した。誰かと同じ形でなくても、満ちた日々はつくれる。',{joy:10,health:6},{flags:['independent','balance']})
]),
E(38,'too-many-things','働き方','机の上が、いっぱいだ','頼まれる仕事が増え、休む日が減っていた。','「あなたなら」と言われるのはうれしい。けれど、その言葉を全部受け取っているうちに、自分の時間が小さくなっていた。\n\n朝、出かける前に少し立ち止まる。このまま続ける以外にも、選べることがあるはずだ。','city',[
C('delegate','仕事を分け、仲間に任せる','一人で抱えるやり方を変える。','任せ始めは落ち着かなかった。けれど人の工夫が入ると、自分だけではつくれないやり方が見えてきた。',{connection:8,health:8,knowledge:4},{flags:['leader','boundaries']}),
C('focus','取り組むことを絞る','大切な仕事に集中する。','断る連絡は、短くても勇気がいった。空いた時間で一つを丁寧に終え、働く感覚が少し戻ってきた。',{health:9,courage:7},{flags:['boundaries']}),
C('challenge','期間を決めて、挑戦を続ける','終わったあとに休む計画も入れる。','忙しい期間を仲間と走りきった。達成感を味わったあと、予定していた休みを本当に取ることまでを仕事にした。',{money:15,courage:8,health:-5,joy:5},{flags:['achievement']}),
C('shift','働く時間を減らす相談をする','生活の重心を動かす。','収入の見通しも確かめて、少しゆっくり働く形にした。明るいうちの帰り道を、久しぶりに味わった。',{health:10,joy:7},{flags:['balance']})
]),
E(38,'care-balance','支える人','自分のことも、頼んでいい','人の予定で埋まった手帳を、じっと見た。','家族を手伝う日々に慣れたころ、自分の疲れを後回しにしていたと気づいた。誰かを大切にすることと、全部できることは違う。\n\nこの先も関わっていくために、支え方を少し変えようと思った。','home',[
C('ask','周囲に、今の負担を伝える','具体的に手伝ってほしいことを話す。','「もっと早く言ってくれたら」と言われ、少し泣きそうになった。言わなければ見えない疲れもある。',{health:10,connection:7,courage:5},{flags:['care_network']}),
C('service','使える支援をもう一度調べる','状況の変化に合わせて相談する。','前には必要なかった支援が、今の暮らしには合っていた。頼る先が増えると、一緒に笑う余裕も戻った。',{knowledge:8,health:9},{flags:['care_network','resourceful']}),
C('boundary','手伝わない日をつくる','自分の予定も、予定に入れる。','休む日に罪悪感は残った。それでも好きな場所へ出かけた帰り、次に会う日を前より穏やかに思えた。',{health:12,joy:6},{flags:['boundaries']}),
C('together','本人と、今後の希望を話す','お互いの暮らしを、同じ重さで。','できないことを言うだけでなく、どう暮らしたいかを聞き合った。助ける人と助けられる人だけではない会話になった。',{connection:10,knowledge:5},{flags:['listener']})
],{flags:['caregiver']}),
E(40,'midway','節目','まだ、道の途中','四十歳の朝も、いつもの音で始まった。','{home}の空を見上げる。昔は、四十歳になれば迷わなくなると思っていた。実際には、迷い方が少し変わっただけだった。\n\nこれまで積んだものを持ったまま、次の十年の方向を選んでみる。','town',[
C('deepen','今の道を、もっと深く歩く','慣れを、熟練に変える。','大きく変わらない日々の中にも、工夫の余地はあった。続けるという選択を、今度は自分の意思で選び直した。',{knowledge:10,money:10,joy:4},{flags:['expert']}),
C('restart','以前から気になる分野を学ぶ','仕事と別の可能性を育てる。','初回の講座で、また初心者になった。わからないことを聞く勇気が、若いころより少しだけあった。',{knowledge:10,courage:9},{flags:['second_start','continued_learning']}),
C('people','人と過ごす時間を増やす','会いたい人に、先に連絡する。','忙しさが落ち着く日を待つのをやめた。短いお茶の時間でも、顔を見て話すと心に残った。',{connection:10,joy:7},{bond:{haru:8,aoi:8,ren:5}}),
C('slow','暮らしを、少し小さく整える','自分に必要なものを選び直す。','減らしたものより、残したものがよく見えるようになった。余白を埋めずにいることにも、少し慣れた。',{health:10,joy:7},{flags:['simple_life']})
]),
E(40,'independent-path','自分の仕事','大きくする、続けていく','小さく始めた仕事が、節目を迎えていた。','自分の名前で引き受ける仕事が増えた。最初の一件を喜んでいたころには、想像しなかった悩みもある。\n\nもっと広げるのか、今の大きさを守るのか。誰かの成功例ではなく、自分の暮らしに合う形を考える。','city',[
C('grow','仲間と、少し規模を広げる','役割と資金計画を固めて進む。','相談相手が増えた分、調整することも増えた。それでも一人の仕事では出会えなかった風景が見えた。',{connection:9,courage:10,money:14,health:-4},{flags:['business_owner'],set:{career:'小さな事業を営む人'}}),
C('small','一人で続けられる規模を守る','仕事の選び方を整える。','全部の依頼を受けなくても、続けられる形があった。得意なことと生活の速度が、少しずつ合ってきた。',{health:8,joy:7,money:9},{flags:['boundaries'],set:{career:'自分のペースで働く人'}}),
C('team','組織に加わり、経験を生かす','安定と協働の形を探す。','一人で悩んでいたことを、会議で話せるようになった。自由の形は変わったけれど、積んだ経験は消えなかった。',{money:12,connection:7,health:5},{flags:['employed'],set:{career:'経験を生かす会社員'}}),
C('pause','仕事を整理し、少し休む','次の形を急いで決めない。','引き継ぎを終え、予定の少ない朝を迎えた。名刺のない時間にも、自分の好きなことはちゃんと残っていた。',{health:12,joy:6},{flags:['second_start'],set:{career:'次の働き方を考える人'}})
],{flags:['independent_work']}),
E(42,'body','心と体','少し、歩く速度を変えて','いつもの階段が、今日は長く感じられた。','忙しさが続き、眠りも浅くなっていた。予定帳を見れば、休むための時間だけが書かれていない。\n\n体からの小さな合図を、大きな問題になる前に受け取りたい。今の生活から、どこを変えてみよう。','park',[
C('check','気になることを医療機関で相談する','必要な確認をしてもらう。','ひとりで推測するのをやめ、気になっていたことを伝えた。確認できたことと、日々見直したいことが整理された。',{health:10,knowledge:5},{flags:['health_care']}),
C('walk','無理のない散歩を習慣にする','続けやすい距離から始める。','同じ道にも、毎日少しずつ違う光があった。歩いた距離より、外へ出る時間ができたことがうれしかった。',{health:9,joy:6},{flags:['active']}),
C('sleep','寝る時間を、予定として守る','夜の用事を減らしてみる。','全部を終えてから休むのではなく、休むために区切った。翌朝の自分に、少し優しくできた気がした。',{health:12,joy:4},{flags:['rest','boundaries']}),
C('talk','疲れていることを、誰かに話す','気持ちの負担もほどいてみる。','「それは疲れるよ」と言われて、初めて力が抜けた。話しただけで終わらせず、予定を一つ一緒に減らした。',{health:7,connection:8},{bond:{haru:7,aoi:7}})
]),
E(44,'long-time','友情','元気？ と打って、消した','懐かしい名前が、連絡先の上に浮かんだ。','葵とは、しばらく会えていない。連絡しようと思うたび、相手も忙しいだろうと画面を閉じていた。\n\n共通の話題は、前ほど多くないかもしれない。それでも声を聞きたいという気持ちだけは、今も残っている。','home',[
C('message','短い近況を送る','返事を急がせない一言にする。','数日後、葵から長い返事が届いた。空いた年月を全部埋めなくても、今日の話からまた始められた。',{connection:10,joy:6},{bond:{aoi:15}}),
C('meet','都合のいい日を聞いてみる','会える日を、一緒に探す。','予定が合うまで少し時間がかかった。ようやく会えた日、最初の一言で、昔と今がゆっくりつながった。',{connection:9,joy:8},{bond:{aoi:14}}),
C('letter','手紙で、伝えたいことを書く','相手の時間で読めるように。','書いているうちに、感謝していた場面をいくつも思い出した。返事より先に、書けたことがうれしかった。',{joy:7,knowledge:4,connection:5},{flags:['writer'],bond:{aoi:10}}),
C('wait','今日は、静かに思い出す','連絡は、気持ちが整ってから。','古い写真を一枚だけ見た。関係を続ける形は一つではない。今夜は懐かしさを、悪くないものとして抱えた。',{joy:6,health:5},{flags:['reflective']})
]),
E(44,'haru-distance','幼なじみ','春からの引っ越し報告','「少し遠くなる」と、いつもの調子で届いた。','長くつながってきた春が、別の街で暮らすことになった。いつでも会えると思っていた距離が、変わろうとしている。\n\nこれまで何度も一緒に歩いた道を思い出す。これからの関わり方も、また選んでいけるだろうか。','station',[
C('visit','落ち着いたら訪ねると約束する','新しい街も、一緒に歩きたい。','春は、おすすめの場所を探しておくと言った。遠くなる寂しさに、まだ知らない楽しみが加わった。',{joy:8,connection:8},{flags:['haru_visit'],bond:{haru:14}}),
C('routine','定期的に話す日をつくる','短い通話でも続けてみる。','画面越しの会話には、別の街の生活音が混ざった。会えない時間にも、知らない人にならずにいられた。',{connection:10,joy:5},{bond:{haru:15}}),
C('memory','一緒に歩いた街の記録を贈る','思い出を、持っていける形に。','写真につけた短い言葉を、春は何度も読んだという。離れる前に、続いてきた時間を確かめられた。',{knowledge:5,joy:7,connection:6},{flags:['community_archive'],bond:{haru:12}}),
C('space','新しい生活を、静かに応援する','連絡の頻度を約束しすぎない。','「落ち着いたら話そう」と送った。近況が空いても心配しすぎず、お互いの新しい日々を尊重することにした。',{health:5,connection:6},{flags:['boundaries'],bond:{haru:8}})
],{flags:['loyal_haru']}),
E(46,'beginner','学び直し','いちばん下手な人になる','体験教室の入口で、少しだけ足が止まった。','気になっていた講座の案内を見つけた。仕事にも肩書きにも、すぐにはつながらない内容だ。\n\n今さら始めても、と思う気持ちと、今だから楽しめるかもしれない気持ち。その両方を連れて入口に立った。','school',[
C('join','初めての講座に参加する','わからないことを、そのまま聞く。','隣の人も初心者だった。できないことを笑い合ううち、上手になる前から楽しんでいいとわかった。',{knowledge:9,courage:8,joy:6},{flags:['second_start','continued_learning']}),
C('self','自分のペースで学び始める','図書館と、少しの時間から。','一人で試す時間は、意外とぜいたくだった。昨日わからなかったことが、今日は少しだけつながった。',{knowledge:10,joy:5},{flags:['continued_learning']}),
C('friend','友人を誘って、一緒に試す','続ける楽しみを分け合う。','葵も違うところでつまずいていた。教え合いながら進むと、練習のあとに話す時間まで楽しみになった。',{knowledge:7,connection:8,joy:5},{flags:['continued_learning'],bond:{aoi:10}}),
C('watch','まずは、見学してみる','今の生活に合うか確かめる。','見ているだけでも、心が動く瞬間があった。今日は申し込まなくても、次に開けられる扉の場所を覚えた。',{knowledge:6,courage:4,health:3},{flags:['curious']})
]),
E(46,'learning-return','積み重ね','学んだことが、誰かへ渡る','昔のノートを見せてほしいと頼まれた。','続けてきた学びの話をすると、知人が「教わってみたい」と言った。自分にはまだ知らないことが多い。\n\nそれでも、最初の一歩の戸惑いなら覚えている。完璧ではないまま、どう渡していけるだろう。','school',[
C('teach','少人数の勉強会を開く','わかる範囲を、正直に伝える。','質問に答えられないときは、一緒に調べた。先生らしく振る舞うより、その姿勢を喜んでもらえた。',{knowledge:9,connection:9,courage:5},{flags:['mentor']}),
C('write','入門用のノートをまとめる','誰かが後から読めるように。','説明を短くするほど、自分の理解も試された。最初に迷ったところを残すと、読みやすいと言ってもらえた。',{knowledge:10,joy:6},{flags:['writer','learning_archive']}),
C('deepen','自分の学びを、さらに続ける','教える役は、今は引き受けない。','誰かに伝えることだけが、学ぶ目的ではなかった。新しい疑問を追いかける時間を、もう少し持つことにした。',{knowledge:12,joy:7},{flags:['scholar']}),
C('connect','詳しい人や場所を紹介する','自分が全部を担わない。','紹介した先で、知人が楽しそうに学び始めた。橋を渡すような関わり方もあるのだと、うれしくなった。',{connection:10,knowledge:5},{flags:['network']})
],{flags:['continued_learning']}),
E(48,'money','これからの暮らし','数字の向こうにあるもの','久しぶりに、家計の記録をまとめて見た。','収入と支出を並べると、普段大切にしているものも見えてきた。将来への備えと、今しかできない経験。\n\nどちらかだけを選ぶのではなく、今の暮らしに合う配分を考えてみることにした。','home',[
C('save','固定費を見直し、余裕をつくる','使っていないものから整理する。','小さな支出をいくつか見直した。好きなことまで削らなくても、少しずつ備えを増やせる余地があった。',{money:12,knowledge:6,health:3},{flags:['resourceful']}),
C('experience','旅や体験のために使う','予算を決めて、今を楽しむ。','知らない場所で食べた夕食を、長く覚えている気がした。使ったお金は戻らなくても、思い出は日常に持ち帰れた。',{money:-15,joy:12,knowledge:5},{requires:{money:15},flags:['traveler']}),
C('learn','これからの制度や備えを調べる','わからないままにしない。','資料を読み、必要なことを窓口で確かめた。一度で全部はわからなくても、次に聞くべきことが見えた。',{knowledge:10,courage:5},{flags:['resourceful']}),
C('talk','大切な人と、お金の話をする','希望も心配も、言葉にする。','金額だけでなく、何に使いたいかを話した。同じ数字を見ても、安心の形が違うことを知った。',{connection:8,knowledge:6},{flags:['intentional_bonds']})
]),
E(50,'half-century','節目','五十年分の、好きなもの','祝うほどでもないと思っていたら、声が届いた。','誕生日に、何人かから短いメッセージが届いた。会っていない人も、毎週顔を合わせる人もいる。\n\n五十歳。数字の大きさより、その間に好きになったものの多さに驚いた。今日を、どう過ごそう。','town',[
C('gather','大切な人と、小さく集まる','大げさでなく、顔を見て話す。','近況と昔話が、同じテーブルに並んだ。よく知っているつもりの人から、知らなかった話を聞けた。',{connection:10,joy:9},{bond:{haru:8,aoi:8,ren:6}}),
C('solo-trip','一人で、好きな場所へ行く','誰にも合わせない一日にする。','何をするかを途中で変えても、誰も困らなかった。自分の好みを、自分で選ぶ楽しさを味わった。',{joy:11,courage:5},{flags:['wanderer']}),
C('create','今の自分を、作品に残す','写真でも、文章でもいい。','若いころと同じ題材でも、見えるものが違った。変わったことを、少し面白がれるようになっていた。',{joy:9,knowledge:6},{flags:['creative','writer']}),
C('ordinary','いつもどおりの一日を味わう','好きな食事と、早めの休息。','特別なことをしない誕生日も、悪くなかった。何気ない一日を好きだと思えることが、静かにうれしかった。',{health:10,joy:8},{flags:['present']})
]),
E(50,'family-growth','家族','少し離れた、その隣で','子どもが、自分だけの予定を話すようになった。','一緒に暮らし始めたころは、毎日が手探りだった。今は、知らない友人や、自分とは違う夢の話を聞く。\n\n頼られることだけが、関わることではなくなってきた。これからの距離も、育てていこうと思う。','home',[
C('listen','まずは、本人の話を聞く','助言を急いで出さない。','最後まで聞くと、相談ではなく報告だったことがわかった。答えを出さなくても、話せる場所ではありたかった。',{connection:10,joy:6},{flags:['listener']}),
C('support','必要な助けを、一緒に考える','決める役目まで引き受けない。','できる支援と難しいことを話した。全部かなえられなくても、現実を一緒に考える時間には意味があった。',{connection:9,knowledge:5},{flags:['mentor']}),
C('share','自分の失敗も、少し話す','完璧な大人のふりをやめる。','意外そうな顔のあと、二人で笑った。正しい道だけを知っているわけではないと、伝えられてよかった。',{courage:7,connection:8,joy:5},{flags:['honest_parent']}),

const STAT_INFO={health:{label:'健やかさ',color:'#6c8c70'},joy:{label:'充実',color:'#c79761'},knowledge:{label:'知性',color:'#7792a0'},courage:{label:'勇気',color:'#bd826f'},connection:{label:'つながり',color:'#9b8daa'}};
const PEOPLE={haru:{name:'春',role:'幼なじみ',color:'#d6b99b',initial:'春'},aoi:{name:'葵',role:'学校で出会う友人',color:'#acc3bc',initial:'葵'},ren:{name:'蓮',role:'道の途中で出会う人',color:'#bac1d4',initial:'蓮'}};
function matches(s,r={}){return (!r.flags||r.flags.every(f=>s.flags.includes(f)))&&(!r.notFlags||r.notFlags.every(f=>!s.flags.includes(f)))&&(!r.stats||Object.entries(r.stats).every(([k,v])=>s.stats[k]>=v))&&(r.money===undefined||s.money>=r.money);}
function pickEvent(s){const es=EVENTS.filter(e=>e.age===AGES[s.index]);return es.find(e=>e.when&&matches(s,e.when))||es.find(e=>!e.when);}
function currentEvent(s){return EVENTS.find(e=>e.id===s.eventId);}
function createGame(name,trait='curious'){
 const stats={health:58,joy:50,knowledge:45,courage:45,connection:45};
 if(trait==='thoughtful')stats.knowledge+=15;if(trait==='curious')stats.courage+=15;if(trait==='warm')stats.connection+=15;
 const s={version:1,name:(name.trim()||'凪').slice(0,16),trait,index:0,phase:'choice',stats,money:8,flags:[trait],bonds:{haru:30,aoi:8,ren:0},career:'高校生',home:'生まれ育った街',relationship:'自分のペース',history:[],eventId:null};
 s.eventId=pickEvent(s).id;return s;
}
function interpolate(text,s){return String(text??'').replace(/\{(name|career|home)\}/g,(_,k)=>s[k]);}
function choose(state,choiceId){
 if(state.phase!=='choice')throw new Error('今は選択できません。');
 const e=currentEvent(state),c=e.choices.find(x=>x.id===choiceId);
 if(!c||!matches(state,c.requires))throw new Error('この選択肢はまだ選べません。');
 const s=structuredClone(state),deltas={};
 for(const [k,v] of Object.entries(c.effects||{})){if(k==='money'){const before=s.money;s.money=Math.max(0,s.money+v);deltas.money=s.money-before;}else if(k in STAT_INFO){const before=s.stats[k];s.stats[k]=Math.max(0,Math.min(100,before+v));deltas[k]=s.stats[k]-before;}}
 for(const [k,v] of Object.entries(c.bond||{}))if(k in PEOPLE)s.bonds[k]=Math.max(0,Math.min(100,s.bonds[k]+v));
 s.flags=[...new Set([...s.flags,...(c.flags||[])])];
 for(const key of ['career','home','relationship'])if(c.set?.[key])s[key]=c.set[key];
 s.history.push({age:e.age,eventId:e.id,title:interpolate(e.title,state),choice:interpolate(c.title,state),result:interpolate(c.result,s),deltas});
 s.phase='result';return s;
}
function advance(state){
 if(state.phase!=='result')return state;
 const s=structuredClone(state);if(s.index===AGES.length-1){s.phase='ending';return s;}
 s.index++;s.phase='choice';s.eventId=pickEvent(s).id;return s;
}
function getEnding(s){
 const rank=Object.entries(s.stats).sort((a,b)=>b[1]-a[1]);const top=rank[0][0];
 const endings={health:['自分の歩幅で、遠くまで。','急がずに、自分の声を聞く。その小さな選択を重ねて、暮らしはあなたに似た形になった。立ち止まった時間にも、ちゃんと意味があった。'],joy:['好き、を集めた人生。','誰かのものさしから少し離れて、心が動くほうへ。たくさんの小さな喜びが、振り返ればひとつの大きな風景になっていた。'],knowledge:['問いつづけた、その先に。','知らなかったことを知るたびに、世界の輪郭が変わった。答えが見つからない日も、あなたの好奇心は次の扉を開いていた。'],courage:['扉の向こうにも、明日。','迷いが消えるのを待たずに、踏み出した日があった。選ばなかった道も胸にしまって、あなたはあなたの物語を歩いてきた。'],connection:['あなたがいたから。','交わした言葉、並んで歩いた道、久しぶりの連絡。誰かとの時間があなたをつくり、あなたとの時間が誰かの人生に残っている。']};
 const [title,text]=endings[top];return {title,text,top};
}
function validateSave(s){
 if(!s||s.version!==1||typeof s.name!=='string'||s.name.length>16||!['curious','thoughtful','warm'].includes(s.trait))return false;
 if(!Number.isInteger(s.index)||s.index<0||s.index>=AGES.length||!['choice','result','ending'].includes(s.phase))return false;
 if(!s.stats||!Object.keys(STAT_INFO).every(k=>Number.isFinite(s.stats[k])&&s.stats[k]>=0&&s.stats[k]<=100)||!Number.isFinite(s.money)||s.money<0||s.money>1e9)return false;
 if(!Array.isArray(s.flags)||s.flags.some(f=>typeof f!=='string')||!s.bonds||!Object.keys(PEOPLE).every(k=>Number.isFinite(s.bonds[k])&&s.bonds[k]>=0&&s.bonds[k]<=100))return false;
 if(!['career','home','relationship'].every(k=>typeof s[k]==='string'&&s[k].length<=100))return false;
 const e=EVENTS.find(e=>e.id===s.eventId);if(!e||e.age!==AGES[s.index])return false;
 if(!Array.isArray(s.history)||s.history.length!==(s.index+(s.phase==='choice'?0:1)))return false;
 if(s.phase==='ending'&&s.index!==AGES.length-1)return false;
 return s.history.every((h,i)=>h&&h.age===AGES[i]&&EVENTS.some(e=>e.id===h.eventId&&e.age===h.age)&&['title','choice','result'].every(k=>typeof h[k]==='string'&&h[k].length<2000)&&h.deltas&&Object.entries(h.deltas).every(([k,v])=>(k==='money'||k in STAT_INFO)&&Number.isFinite(v)));
}
function diaryText(s){const end=getEnding(s);return `いくつもの明日 ─ ${s.name}の人生\n${s.phase==='ending'?end.title+'\n'+end.text:'いま、'+AGES[s.index]+'歳の物語'}\n\n`+s.history.map(h=>`${h.age}歳 ─ ${h.title}\n選んだこと：${h.choice}\n${h.result}`).join('\n\n');}

function ending(){const end=getEnding(state);const closePeople=Object.entries(state.bonds).sort((a,b)=>b[1]-a[1])[0];return `<main class="ending"><div class="ending-art"></div><div class="ending-content"><span class="eyebrow">THE STORY OF ${esc(state.name)}</span><h1>${esc(end.title)}</h1><p class="ending-prose">${esc(end.text)}</p><div class="end-summary"><span>16歳から80歳</span><i></i><span>${state.history.length}の選択</span><i></i><span>${esc(state.career)}</span></div><div class="ending-cards"><div><small>大切にしてきたもの</small><strong>${STAT_INFO[end.top].label}</strong><p>日々の選択が、あなたらしさに。</p></div><div><small>そばに残るつながり</small><strong>${closePeople[1]>20?PEOPLE[closePeople[0]].name:'あなた自身'}</strong><p>${closePeople[1]>20?'ともに過ごした時間が、今もここに。':'ひとりの時間も、大切な物語。'}</p></div><div><small>たどり着いた暮らし</small><strong>${esc(state.home)}</strong><p>${esc(state.relationship)}</p></div></div><blockquote>人生は、点数ではない。<br>あなたが選んだ日々の、重なりだ。</blockquote><div class="end-actions"><button class="primary" data-action="journal">${icon('book')} 人生のしおりを開く</button><button class="secondary" data-action="download-diary">${icon('save')} 物語を残す</button></div><button class="text-btn new-link" data-action="new">もうひとつの人生を歩む ${icon('arrow',17)}</button><p class="end-foot">この先にも、きっと明日はつづく。</p></div></main>`;}
function render(focus=false){$('#app').innerHTML=header()+(started&&state?(state.phase==='ending'?ending():game()):intro());if(focus){window.scrollTo({top:0,behavior:'instant'});$('#story-heading')?.focus({preventScroll:true});}}
function openModal(type){focusReturn=document.activeElement;modal=type;renderModal();$('#game-dialog').showModal();$('#game-dialog .close-modal')?.focus();}
function closeModal(){const dialog=$('#game-dialog');dialog?.close();$('#modal-root').innerHTML='';modal=null;if(focusReturn?.isConnected)focusReturn.focus();else $('[data-action="settings"]')?.focus();}
function renderModal(){let title='',content='';if(modal==='journal'){title='人生のしおり';content=`<p class="modal-sub">${esc(state.name)}が選んできた、小さなこと、大きなこと。</p>${state.history.length?`<div class="journal">${state.history.map(h=>`<article><div class="journal-age">${h.age}<small>歳</small></div><div><h3>${esc(h.title)}</h3><strong>${esc(h.choice)}</strong><p>${esc(h.result)}</p></div></article>`).join('')}</div><button class="secondary full-width" data-action="download-diary">${icon('save')} ここまでの物語を保存</button>`:'<div class="empty-state">まだ白い、最初のページ。<br>ひとつ選ぶと、ここに足あとが残ります。</div>'}`;}
 if(modal==='people'){title='あなたをとりまく人たち';content=`<p class="modal-sub">近づいたり、少し離れたり。それぞれの人生が、交わる。</p><div class="people-list">${Object.entries(PEOPLE).map(([id,p])=>{const v=state.bonds[id];return `<article><div class="person-avatar" style="background:${p.color}">${p.initial}</div><div><h3>${p.name}<small>${p.role}</small></h3><p>${v>=65?'心を許せる、大切な存在。':v>=35?'日々を分かち合う、身近な存在。':v>0?'これから、少しずつ知っていく。':'まだ、物語の途中で出会う前。'}</p><div class="bond-track" aria-label="親しさ ${v}/100"><i style="width:${v}%"></i></div></div></article>`;}).join('')}</div><p class="subtle">親しさは、それぞれの人との選択で変わります。</p>`;}
 if(modal==='settings'){title='物語の設定';content=`<div class="settings-row"><div><strong>選択のヒント</strong><p>選ぶ前に、能力やお金への影響を表示します。</p></div><input aria-label="選択のヒントを表示" type="checkbox" id="settings-hints" ${hints?'checked':''}></div><div class="setting-section"><h3>セーブデータ</h3><p>このブラウザに自動保存します。別の端末で続けたいときは、セーブデータを移せます。</p><div class="button-pair"><button class="secondary" data-action="export" ${!state?'disabled':''}>${icon('save',17)} 書き出す</button><button class="secondary" data-action="import">読み込む</button><input type="file" id="save-file" accept=".json,application/json" hidden></div></div><div class="setting-section"><h3>このゲームについて</h3><p>現代の日本を舞台にしたフィクションです。32の節目と、選択によって変わる${EVENTS.length}の場面を用意しています。お金は選択による収支のみを記録します。自動的な給与・生活費の計算はありません。</p><p>すべての人生に、異なるよさがあります。能力の数字は、勝敗を決める点数ではありません。</p></div>${state?'<button class="text-btn danger" data-action="new">新しい人生をはじめる</button>':''}`;}
 if(modal==='new'){title='もうひとつの、はじまり。';content=`<p class="modal-sub">新しく始めると、このブラウザの進行を置き換えます。今の人生を残したい場合は、先にセーブを書き出してください。</p><button class="secondary full-width" data-action="export">${icon('save')} 今のセーブを書き出す</button><div class="modal-setup">${setupForm()}</div>`;}
 $('#modal-root').innerHTML=`<dialog id="game-dialog" class="modal" aria-labelledby="modal-title"><div class="modal-heading"><h2 id="modal-title">${title}</h2><button class="icon-btn close-modal" data-action="close" aria-label="閉じる">${icon('close')}</button></div><div class="modal-body">${content}</div></dialog>`;
 $('#game-dialog').addEventListener('cancel',e=>{e.preventDefault();closeModal();});$('#game-dialog').addEventListener('click',e=>{if(e.target===$('#game-dialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal();}});
}
function download(content,name,type){const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function setHints(value){hints=value;try{localStorage.setItem(PREF,String(value));}catch{}if(started)render();}
document.addEventListener('submit',e=>{if(e.target.id!=='start-form')return;e.preventDefault();const name=new FormData(e.target).get('name');state=createGame(String(name),trait);started=true;closeModal();persist();render(true);});
document.addEventListener('click',e=>{
 const tr=e.target.closest('[data-trait]');if(tr){trait=tr.dataset.trait;document.querySelectorAll('[data-trait]').forEach(el=>{el.classList.toggle('selected',el.dataset.trait===trait);el.setAttribute('aria-pressed',String(el.dataset.trait===trait));});return;}
 const ch=e.target.closest('[data-choice]');if(ch&&!ch.disabled&&state?.phase==='choice'){state=choose(state,ch.dataset.choice);persist();render();$('.result-panel')?.scrollIntoView({behavior:'smooth',block:'nearest'});$('.next-row button')?.focus({preventScroll:true});return;}
 const a=e.target.closest('[data-action]');if(!a||a.disabled)return;e.preventDefault();switch(a.dataset.action){
 case 'home':started=false;render();window.scrollTo(0,0);break;
 case 'resume':started=true;render(true);break;
 case 'journal':case 'people':case 'settings':openModal(a.dataset.action);break;
 case 'new':openModal('new');break;
 case 'close':closeModal();break;
 case 'next':state=advance(state);persist();render(true);break;
 case 'download-diary':download(diaryText(state),`${state.name}の人生.txt`,'text/plain;charset=utf-8');toast('人生の物語を書き出しました');break;
 case 'export':download(JSON.stringify(state,null,2),'ikutsumono-ashita-save.json','application/json');toast('セーブデータを書き出しました');break;
 case 'import':$('#save-file').click();break;
 }});
document.addEventListener('change',async e=>{if(e.target.id==='hint-toggle'||e.target.id==='settings-hints')setHints(e.target.checked);if(e.target.id==='save-file'){const file=e.target.files[0];if(!file)return;if(file.size>250000){toast('ファイルが大きすぎます。ゲームのセーブを選んでください。');return;}try{const s=JSON.parse(await file.text());if(!validateSave(s))throw new Error('invalid');if(state&&!window.confirm('読み込んだセーブで、現在の進行を置き換えますか？'))return;state=s;started=true;persist();closeModal();render(true);toast('セーブデータを読み込みました');}catch{toast('このセーブデータは読み込めません。ファイルを確認してください。');}}});
document.addEventListener('keydown',e=>{if(modal||!started||!state||['INPUT','TEXTAREA','SELECT','BUTTON'].includes(document.activeElement?.tagName))return;if(state.phase==='choice'&&['1','2','3','4'].includes(e.key)){const btn=document.querySelectorAll('[data-choice]')[Number(e.key)-1];if(btn&&!btn.disabled)btn.click();}else if(e.key==='Enter'&&state.phase==='result')$('[data-action="next"]')?.click();});
render();if(saveError)toast('保存データを読み込めませんでした。新しい人生を始められます。');
</script>
</head>
<body><div id="app"></div><div id="modal-root"></div><div id="toast" role="status" aria-live="polite"></div><noscript>このゲームを遊ぶには、ブラウザのJavaScriptを有効にしてください。</noscript></body>
</html>
